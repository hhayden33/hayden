    </div>

<script src="/js/simple-list.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  initSimpleList({
    storageKey: 'work:notes:v1',
    listEl: document.getElementById('listEl'),
    inputEl: document.getElementById('inputEl'),
    addBtn: document.getElementById('addBtn'),
    emptyEl: document.getElementById('emptyEl'),
    useDone: false
  });
});
</script>
