<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10151A">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<meta name="apple-mobile-web-app-title" content="Sleep">

<title>Sleep · 88YYDS AIO</title>
<script src="/vendor/supabase-js@2.112.4.min.js"></script>
<script src="/sync.js" defer></script>
<script src="/topbar.js" defer></script>
<script src="/js/os-nav.js" defer></script>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/main.css">
</head>
<body>
<div class="page">

  <div class="dash-header">
    <h1 class="dash-title"><span class="dash-title-mark">Sleep</span><span class="dash-title-orb"></span><span class="dash-title-kicker">88YYDS AIO · Life</span></h1>
    <a href="/life/index.html" class="dash-home-btn" aria-label="Back to Life dashboard" title="Back to Life dashboard">▦</a>
  </div>

  <!-- Same #sleepCard markup/ids as the Life dashboard's own Sleep card —
       js/sleep.js just does getElementById lookups, so it renders here
       identically without any page-specific changes. -->
  <div class="section" id="sleep">
    <div class="section-title">Sleep</div>
    <div class="gm-card" id="sleepCard">
      <div class="empty-state" id="sleepEmpty" style="display:none;">No sleep data yet.</div>
      <div id="sleepBody" style="display:none;">
        <div class="sleep-group">
          <div class="sleep-duration-row">
            <span class="sleep-duration" id="sleepDuration">—</span>
            <span class="sleep-duration-badges">
              <span class="sleep-score" id="sleepScore" style="display:none;"></span>
              <span class="sleep-status" id="sleepStatus"></span>
            </span>
          </div>
          <div class="sleep-target-row">
            <div class="sleep-target-track"><div class="sleep-target-fill" id="sleepTargetFill" style="width:0%"></div></div>
            <span class="sleep-target-label" id="sleepTargetLabel"></span>
          </div>
          <div class="sleep-compare" id="sleepCompare" style="display:none;"></div>
        </div>
        <div class="sleep-group">
          <div class="sleep-stage-bar" id="sleepStageBar" style="display:none;"></div>
          <div class="sleep-stage-list" id="sleepStageList" style="display:none;"></div>
          <div class="sleep-times" id="sleepTimes" style="display:none;"></div>
        </div>
        <div class="sleep-trend" id="sleepTrend" style="display:none;">
          <div class="sleep-trend-label">7-DAY TREND</div>
          <svg class="sleep-trend-svg" id="sleepTrendSvg" viewBox="0 0 280 40" preserveAspectRatio="none"></svg>
          <div class="sleep-trend-days" id="sleepTrendDays"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="/js/dash-core.js" defer></script>
<script src="/js/sleep.js" defer></script>
<script src="/js/sync-register.js" defer></script>
</body>
</html>
