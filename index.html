<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10151A">

<!-- Home Screen icon (Safari → Add to Home Screen) — resized from the
     existing 88YYDS AIO artwork, design unchanged. -->
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<!-- Deliberately no apple-mobile-web-app-capable: that would launch the
     Home Screen icon in a chromeless standalone window instead of
     regular Safari, which isn't wanted here. -->
<meta name="apple-mobile-web-app-title" content="88YYDS AIO">

<title>88YYDS AIO</title>
<script src="/lock.js"></script>
<script src="/vendor/supabase-js@2.112.4.min.js"></script>
<script src="/sync.js" defer></script>
<script src="/js/os-nav.js" defer></script>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/main.css">
<link rel="stylesheet" href="/bento.css">
<style>
html, body { background: #10151A; }
body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 82% 14%, rgba(8, 124, 163, 0.14), transparent 45%),
    radial-gradient(circle at 18% 90%, rgba(85, 32, 128, 0.16), transparent 50%);
  filter: blur(40px);
  pointer-events: none;
  z-index: -2;
}
.home-page {
  max-width: 720px;
  margin: 0 auto;
  padding: 48px 20px 60px;
}
.home-header { text-align: center; margin-bottom: 40px; }
.home-os-name {
  font-size: 13px; font-weight: 800; letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: 10px;
}
.home-date {
  font-size: 22px; font-weight: 700;
  letter-spacing: -0.015em;
  color: var(--text-primary);
}
.home-greeting {
  margin-top: 6px;
  font-size: 13px;
  color: var(--text-tertiary);
}
.home-section-gap { margin-top: 36px; }
@media (max-width: 480px) {
  .home-page { padding: 32px 16px 50px; }
  .home-date { font-size: 18px; }
}
</style>
</head>
<body>
<div class="home-page">

  <div class="home-header">
    <div class="home-os-name">88YYDS AIO</div>
    <div class="home-date" id="homeDate">—</div>
    <div class="home-greeting" id="homeGreeting"></div>
  </div>

  <div class="env-grid">
    <a href="/life/index.html" class="env-card" style="--accent:#20A5A0">
      <div class="env-card-name">Life</div>
      <div class="env-card-cta">Dashboard →</div>
    </a>
    <a href="/work/index.html" class="env-card" style="--accent:#087CA3">
      <div class="env-card-name">Work</div>
      <div class="env-card-cta">Dashboard →</div>
    </a>
  </div>

  <div class="home-section-gap">
    <div class="today-card">
      <div class="today-eyebrow">Today</div>
      <div class="today-groups">
        <div>
          <div class="today-group-label">Life</div>
          <ul class="today-list" id="homeLifeToday"></ul>
          <div class="today-empty" id="homeLifeEmpty" style="display:none;">Nothing left for today.</div>
        </div>
        <div>
          <div class="today-group-label">Work</div>
          <ul class="today-list" id="homeWorkToday"></ul>
          <div class="today-empty" id="homeWorkEmpty" style="display:none;">Nothing left for today.</div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  // ---------- Date + greeting ----------
  document.getElementById('homeDate').textContent =
    new Date().toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' });

  const NAME = 'Hayden';
  function greetingForHour(h) {
    if (h >= 5 && h < 12) return 'Good morning';
    if (h >= 12 && h < 18) return 'Good afternoon';
    return 'Good evening';
  }
  document.getElementById('homeGreeting').textContent =
    greetingForHour(new Date().getHours()) + ', ' + NAME;

  // ---------- Today: Life ----------
  // Same 'goals:<date>' key and 6 AM active-day boundary js/dash-core.js
  // uses on the Life dashboard — read-only here, so Home never needs to
  // duplicate the actual goal-management logic, just surface it.
  function pad2(n) { return String(n).padStart(2, '0'); }
  function dateToKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function activeDateKey() {
    const now = new Date();
    if (now.getHours() < 6) { const d = new Date(now); d.setDate(d.getDate() - 1); return dateToKey(d); }
    return dateToKey(now);
  }
  function storeGet(key) {
    try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
  }
  function renderTodayList(listEl, emptyEl, items) {
    listEl.innerHTML = '';
    const pending = items.filter((t) => !t.done).slice(0, 3);
    if (!pending.length) { emptyEl.style.display = ''; return; }
    emptyEl.style.display = 'none';
    pending.forEach((t) => {
      const li = document.createElement('li');
      li.textContent = t.text;
      listEl.appendChild(li);
    });
  }
  function renderLifeToday() {
    const goals = storeGet('goals:' + activeDateKey()) || [];
    renderTodayList(document.getElementById('homeLifeToday'), document.getElementById('homeLifeEmpty'), goals);
  }

  // ---------- Today: Work ----------
  // 'work:tasks:v1' is the same store js/work-list.js writes on the Work
  // dashboard's Tasks page — see the equivalent read above for Life.
  function renderWorkToday() {
    const tasks = storeGet('work:tasks:v1') || [];
    renderTodayList(document.getElementById('homeWorkToday'), document.getElementById('homeWorkEmpty'), tasks);
  }

  renderLifeToday();
  renderWorkToday();
  window.addEventListener('storage', function () { renderLifeToday(); renderWorkToday(); });
})();
</script>
</body>
</html>
