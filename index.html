<style>
:root {
  --text-primary: #F2F2F2;
  --text-secondary: #AEB7C0;
  --text-tertiary: #687580;
  --success: #20A5A0;
  --warning: #F2C063;
  --danger: #FF6B6B;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #10151A;
  color: var(--text-secondary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  padding: max(28px, env(safe-area-inset-top)) 20px 60px;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 82% 14%, rgba(8, 124, 163, 0.14), transparent 45%),
    radial-gradient(circle at 18% 90%, rgba(85, 32, 128, 0.16), transparent 50%);
  filter: blur(40px);
  pointer-events: none;
  z-index: -2;
  animation: drift 36s ease-in-out infinite alternate;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px;
  pointer-events: none;
  z-index: -1;
}
@keyframes drift {
  0%   { transform: translate3d(0,0,0); }
  100% { transform: translate3d(-22px, 14px, 0); }
}

.page {
  max-width: 1100px;
  margin: 0 auto;
}

/* ===== page title ===== */
.dash-title {
  margin: 0 0 6px;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.025em;
  background: linear-gradient(180deg, #FFFFFF 0%, #B9C7D4 120%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}
@media (max-width: 480px) { .dash-title { font-size: 22px; } }

/* ===== wordmark (icon-matched lockup) ===== */
.wordmark {
  margin: 0 0 4px;
  position: relative;
}
.wordmark-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.wordmark-main {
  font-family: var(--font);
  font-size: 42px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1;
  text-transform: uppercase;
  background: linear-gradient(120deg, #FFFFFF 0%, #EAF1F5 38%, #9FD9DA 68%, #C9A6EE 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  filter: drop-shadow(0 0 26px rgba(85, 32, 128, 0.35));
}
.wordmark-orb {
  flex-shrink: 0;
  width: 11px;
  height: 11px;
  margin-top: 4px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #F1E0FF 0%, #B98AE0 45%, #552080 100%);
  box-shadow: 0 0 16px 3px rgba(168, 63, 175, 0.55), 0 0 32px 10px rgba(8, 124, 163, 0.22);
  animation: orb-pulse 3.6s ease-in-out infinite;
}
@keyframes orb-pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50%      { transform: scale(1.18); opacity: 0.8; }
}
.wordmark-sub {
  margin: 3px 0 18px 2px;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.42em;
  text-transform: uppercase;
  color: var(--text-tertiary);
}
@media (max-width: 480px) {
  .wordmark-main { font-size: 30px; }
  .wordmark-sub { font-size: 12px; letter-spacing: 0.36em; }
}
@media (prefers-reduced-motion: reduce) {
  .wordmark-orb { animation: none; }
}

/* ===== Hero greeting — cursive attempts (Dancing Script, then Snell
   Roundhand/Petit Formal Script, then Mrs Saint Delafield) all read as
   too decorative next to the rest of this UI. Back on --font, just
   bolder and tighter than plain body text (matches main.html's
   treatment) so it still reads as its own moment without breaking from
   the interface's own type system. ===== */
.hero-greeting {
  margin: 0 0 4px;
  font-family: var(--font);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.015em;
  color: var(--text-secondary);
  opacity: 0;
  animation: hero-greeting-in 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  animation-delay: 0.1s;
}
.hero-weather {
  margin: 0 0 18px;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: var(--text-tertiary);
  min-height: 16px;
}
@keyframes hero-greeting-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@media (max-width: 480px) {
  .hero-greeting { font-size: 15px; }
  .hero-weather { font-size: 11.5px; }
}
@media (prefers-reduced-motion: reduce) {
  .hero-greeting { animation: none; opacity: 1; }
}

/* ===== Bento grid ===== */
.bento-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 168px;
  gap: 14px;
  grid-auto-flow: dense;
}

.bento-tile {
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 20px;
  border-radius: 18px;
  border: 1px solid var(--border-subtle, rgba(120, 160, 180, 0.15));
  background: var(--surface, #19232D);
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  text-decoration: none;
  color: inherit;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.25s ease, box-shadow 0.25s ease;
}
.bento-tile:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 12px 40px rgba(0,0,0,0.45), 0 0 24px -8px var(--accent); }

.bento-tile.big  { grid-column: span 2; grid-row: span 2; }
.bento-tile.wide { grid-column: span 2; grid-row: span 1; }

.bento-top {
  display: flex; align-items: flex-start; justify-content: space-between;
}
.bento-num {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
}
.bento-emoji {
  font-size: 26px;
  line-height: 1;
  filter: drop-shadow(0 0 10px var(--accent));
}
.bento-tile.big .bento-emoji { font-size: 34px; }

.bento-spacer { flex: 1; }

.bento-title {
  font-size: 17px; font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.01em;
  margin-bottom: 8px;
}
.bento-tile.big .bento-title { font-size: 23px; }

.bento-footer {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
}
.bento-subtitle {
  font-size: 12px;
  color: var(--text-tertiary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.bento-arrow {
  font-size: 15px; font-weight: 700;
  color: var(--accent);
  flex-shrink: 0;
  transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
}
.bento-tile:hover .bento-arrow { transform: translateX(4px); }

@media (max-width: 720px) {
  .bento-grid { grid-template-columns: repeat(2, 1fr); }
  .bento-tile.big { grid-row: span 1; }
}
@media (max-width: 440px) {
  .bento-grid { grid-template-columns: 1fr; }
  .bento-tile.big, .bento-tile.wide { grid-column: span 1; }
}
</style>

<script>
(function () {
  'use strict';
  // Time-of-day hero greeting — reads the browser's local clock, so it's
  // always correct for whoever has the page open, not when it was built.
  const subEl = document.getElementById('heroGreetingSub');
  if (!subEl) return;

  const NAME = 'Hayden';
  function greetingForHour(h) {
    if (h >= 5 && h < 12) return 'Good morning';
    if (h >= 12 && h < 18) return 'Good afternoon';
    return 'Good evening';
  }
  function renderGreeting() {
    subEl.textContent = greetingForHour(new Date().getHours()) + ', ' + NAME;
  }
  renderGreeting();
  setInterval(renderGreeting, 60 * 1000);
})();
</script>

<script>
(function () {
  'use strict';
  // Melbourne current conditions — Open-Meteo, no API key needed. Cached
  // in localStorage (shared with main.html's identical copy of this
  // block, same cache key) so hopping between pages doesn't refetch, and
  // a stale/missing network still shows the last known reading rather
  // than nothing.
  const el = document.getElementById('heroWeather');
  if (!el) return;
  const CACHE_KEY = 'weather:melbourne';
  const MAX_AGE_MS = 30 * 60 * 1000;
  const WEATHER_LABELS = {
    0: 'Clear', 1: 'Mostly clear', 2: 'Partly cloudy', 3: 'Overcast',
    45: 'Foggy', 48: 'Foggy',
    51: 'Light drizzle', 53: 'Drizzle', 55: 'Heavy drizzle',
    56: 'Freezing drizzle', 57: 'Freezing drizzle',
    61: 'Light rain', 63: 'Rain', 65: 'Heavy rain',
    66: 'Freezing rain', 67: 'Freezing rain',
    71: 'Light snow', 73: 'Snow', 75: 'Heavy snow', 77: 'Snow grains',
    80: 'Rain showers', 81: 'Rain showers', 82: 'Heavy showers',
    85: 'Snow showers', 86: 'Snow showers',
    95: 'Thunderstorm', 96: 'Thunderstorm', 99: 'Thunderstorm'
  };
  function render(data) {
    const label = WEATHER_LABELS[data.code];
    if (!label || typeof data.temp !== 'number') return;
    el.textContent = 'Melbourne · ' + Math.round(data.temp) + '°C · ' + label;
  }
  function loadCache() {
    try {
      const raw = JSON.parse(localStorage.getItem(CACHE_KEY));
      return (raw && typeof raw.temp === 'number') ? raw : null;
    } catch (e) { return null; }
  }
  const cached = loadCache();
  if (cached) render(cached);
  if (cached && (Date.now() - cached.fetchedAt) < MAX_AGE_MS) return;

  fetch('https://api.open-meteo.com/v1/forecast?latitude=-37.8136&longitude=144.9631&current=temperature_2m,weather_code&timezone=Australia%2FMelbourne')
    .then(r => r.json())
    .then(data => {
      const cur = data && data.current;
      if (!cur || typeof cur.temperature_2m !== 'number') return;
      const out = { temp: cur.temperature_2m, code: cur.weather_code, fetchedAt: Date.now() };
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(out)); } catch (e) {}
      render(out);
    })
    .catch(() => {}); // offline/blocked — leave whatever render() already did (cache or nothing)
})();
</script>
