<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Today · Dashboard</title>
<style>
/* ============================================================= */
/*  Shared dashboard design tokens — matches main.html/index.html */
/* ============================================================= */
:root {
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --success: #6BE3A4;
  --warning: #F2C063;
  --danger:  #FF6B6B;
  --run:     #FF8F5E;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #050506;
  color: var(--text-secondary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  padding: max(28px, env(safe-area-inset-top)) 20px 60px;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 82% 14%, rgba(224, 118, 88, 0.16), transparent 45%),
    radial-gradient(circle at 18% 90%, rgba(180, 180, 200, 0.06), transparent 50%);
  filter: blur(40px);
  pointer-events: none;
  z-index: -2;
  animation: drift 36s ease-in-out infinite alternate;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px;
  pointer-events: none;
  z-index: -1;
}
@keyframes drift {
  0%   { transform: translate3d(0,0,0); }
  100% { transform: translate3d(-22px, 14px, 0); }
}

.page { max-width: 720px; margin: 0 auto; }

/* Back-to-dashboard pill */
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px 8px 10px;
  margin: 0 0 14px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 999px;
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 12px; font-weight: 600;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, color 0.15s;
}
.back-btn:hover { background: rgba(255,255,255,0.07); color: var(--text-primary); }

.dash-title {
  margin: 0 0 18px;
  font-size: 28px; font-weight: 700;
  letter-spacing: -0.025em;
  background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
@media (max-width: 480px) { .dash-title { font-size: 22px; } }

.section { margin-top: 8px; }
.section-title {
  font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-tertiary);
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 12px;
}
.section-title::before {
  content: ''; width: 18px; height: 1px;
  background: var(--text-tertiary); opacity: 0.6;
}
.section-title::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, rgba(255,255,255,0.08), transparent);
}

.gm-card {
  position: relative;
  background: rgba(255, 255, 255, 0.04);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 14px;
  backdrop-filter: blur(24px) saturate(1.2);
  -webkit-backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  overflow: hidden;
}
a.gm-card.card-link {
  display: block; text-decoration: none; color: inherit;
  border: 1px solid transparent;
  transition: transform 0.2s cubic-bezier(0.22,1,0.36,1), border-color 0.2s;
}
a.gm-card.card-link:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.12); }

.gm-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  flex-wrap: wrap; gap: 12px;
}
.gm-header-left { display: flex; flex-direction: column; }
.gm-eyebrow {
  font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-tertiary); margin-bottom: 6px;
}
.gm-progress-row { display: flex; align-items: baseline; gap: 6px; }
.gm-progress-num {
  font-size: 38px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.045em; color: var(--text-primary); line-height: 1;
}
.gm-progress-total { font-family: var(--font-mono); font-size: 16px; color: var(--text-tertiary); }
.gm-progress-label {
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.10em; text-transform: uppercase;
  color: var(--text-tertiary); margin-left: 4px;
}
.link-arrow {
  font-size: 18px; font-weight: 700; color: var(--success);
  flex-shrink: 0; align-self: center;
  transition: transform 0.2s cubic-bezier(0.22,1,0.36,1);
}
a.card-link:hover .link-arrow { transform: translateX(4px); }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  gap: 10px; margin-top: 4px;
}
.stat {
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px; padding: 12px;
}
.stat-num {
  font-size: 22px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em; color: var(--text-primary); line-height: 1;
}
.stat-label {
  margin-top: 6px;
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-tertiary);
}

.empty-state {
  text-align: center; font-size: 12px; font-style: italic;
  color: var(--text-tertiary); padding: 14px 0;
}

/* Read-only row list (supplements / to-do preview) */
.ro-list { list-style: none; margin: 0; padding: 0; }
.gm-row {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px; margin-bottom: 6px;
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
}
.gm-row:last-child { margin-bottom: 0; }
.gm-row.gm-row-done { opacity: 0.45; }
.gm-row.gm-row-done .gm-text { text-decoration: line-through; text-decoration-color: rgba(255,255,255,0.4); }
.ro-check {
  width: 20px; height: 20px; flex-shrink: 0;
  border: 1.5px solid rgba(255,255,255,0.18);
  background: rgba(0,0,0,0.28); border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: #0A0A0B; font-weight: 700;
}
.ro-check.is-on { background: var(--success); border-color: var(--success); }
.gm-text { flex: 1; font-size: 13.5px; color: var(--text-primary); }
.row-meta { font-size: 11.5px; color: var(--text-tertiary); font-family: var(--font-mono); white-space: nowrap; }

/* Exercise rows for today's training */
.ex-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ex-name { font-size: 13.5px; color: var(--text-primary); font-weight: 500; }
.training-note { margin-top: 12px; font-size: 12.5px; color: var(--text-secondary); }

.card-footer-link {
  display: flex; align-items: center; justify-content: flex-end; gap: 6px;
  margin-top: 14px; padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,0.06);
  text-decoration: none; color: var(--text-primary);
  font-size: 12px; font-weight: 600;
  -webkit-tap-highlight-color: transparent;
}
.card-footer-link:hover { color: var(--success); }

/* Header card */
.today-header { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.today-date { font-size: 22px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em; }
.split-badge {
  display: inline-flex; align-items: center;
  padding: 8px 16px; border-radius: 999px;
  font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  border: 1px solid currentColor;
}

/* Finance line */
.finance-line { font-size: 14px; color: var(--text-primary); }
.finance-line strong { color: var(--text-primary); }

/* Streaks row */
.streak-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.streak-pill {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px; padding: 12px 8px;
  text-decoration: none;
}
.streak-pill-icon { font-size: 16px; }
.streak-pill-num {
  font-size: 18px; font-weight: 700; color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}
.streak-pill-label {
  font-size: 9.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-tertiary);
}

@media (max-width: 480px) {
  body { padding: max(20px, env(safe-area-inset-top)) 14px 50px; }
  .gm-card { padding: 16px; }
  .gm-progress-num { font-size: 32px; }
  .today-date { font-size: 19px; }
}
</style>
</head>
<body>
<div class="page">

  <a href="index.html" class="back-btn" aria-label="Back to dashboard">← Dashboard</a>
  <h1 class="dash-title">Today</h1>

  <!-- 1. HEADER -->
  <div class="section">
    <div class="gm-card today-header">
      <div class="gm-header-left">
        <div class="gm-eyebrow">TODAY</div>
        <div class="today-date" id="todayDate">—</div>
      </div>
      <span class="split-badge" id="splitBadge">—</span>
    </div>
  </div>

  <!-- 2. WATER -->
  <div class="section">
    <div class="section-title">Water</div>
    <a class="gm-card card-link" href="po-water.html">
      <div class="gm-header">
        <div class="gm-header-left">
          <div class="gm-eyebrow" id="waterUnitLabel">DRANK TODAY</div>
          <div class="gm-progress-row">
            <span class="gm-progress-num" id="waterNum">0</span>
            <span class="gm-progress-total" id="waterTotal">/ 0</span>
          </div>
        </div>
        <span class="link-arrow">→</span>
      </div>
    </a>
  </div>

  <!-- 3. TODAY'S TRAINING -->
  <div class="section">
    <div class="section-title">Today's Training</div>
    <div class="gm-card">
      <div id="trainingBody"><div class="empty-state">Loading…</div></div>
      <a class="card-footer-link" id="trainingLink" href="gym.html">Open Fitness →</a>
    </div>
  </div>

  <!-- 4. SUPPLEMENT STACK -->
  <div class="section">
    <div class="section-title">Supplement Stack</div>
    <div class="gm-card">
      <div class="gm-header" style="margin-bottom: 12px;">
        <div class="gm-eyebrow">TAKEN TODAY</div>
        <span class="gm-progress-total" id="stackCount" style="font-size: 14px; color: var(--text-primary);">— / —</span>
      </div>
      <div id="stackList"></div>
      <a class="card-footer-link" href="main.html">Manage stack →</a>
    </div>
  </div>

  <!-- 5. TO-DO -->
  <div class="section">
    <div class="section-title">To Do</div>
    <div class="gm-card">
      <div class="gm-header" style="margin-bottom: 12px;">
        <div class="gm-eyebrow">TODAY'S LIST</div>
        <span class="gm-progress-total" id="todoCount" style="font-size: 14px; color: var(--text-primary);">— / —</span>
      </div>
      <div id="todoList"></div>
      <a class="card-footer-link" href="main.html">View all →</a>
    </div>
  </div>

  <!-- 6. FINANCE -->
  <div class="section">
    <div class="section-title">Finance</div>
    <a class="gm-card card-link" href="finance.html">
      <div class="gm-header">
        <div class="finance-line" id="financeLine">—</div>
        <span class="link-arrow">→</span>
      </div>
    </a>
  </div>

  <!-- 7. STREAKS -->
  <div class="section">
    <div class="section-title">Streaks</div>
    <div class="gm-card">
      <div class="streak-row">
        <a class="streak-pill" href="po-water.html">
          <span class="streak-pill-icon">💧</span>
          <span class="streak-pill-num" id="streakWater">0</span>
          <span class="streak-pill-label">Water</span>
        </a>
        <a class="streak-pill" href="main.html">
          <span class="streak-pill-icon">💊</span>
          <span class="streak-pill-num" id="streakStack">0</span>
          <span class="streak-pill-label">Stack</span>
        </a>
        <a class="streak-pill" href="gym.html">
          <span class="streak-pill-icon">💪</span>
          <span class="streak-pill-num" id="streakWorkout">0</span>
          <span class="streak-pill-label">Workout</span>
        </a>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  // ============================================================
  // READ-ONLY AGGREGATION LAYER
  // Every value below is derived by reading localStorage keys owned
  // by the other five pages. Nothing on this page ever writes to
  // localStorage — see main.html / gym.html / po-water.html /
  // finance.html / running.html for the pages that own this data.
  // ============================================================

  function storeGet(key) {
    try { var v = localStorage.getItem(key); return v == null ? null : JSON.parse(v); }
    catch (e) { return null; }
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function parseYMD(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDaysKey(key, delta) { var d = parseYMD(key); d.setDate(d.getDate() + delta); return ymd(d); }

  var today = new Date();
  var todayKey = ymd(today);

  // 6am-rollover "active date" — matches main.html's getActiveDateString(),
  // used by the To Do list, goal streak, and supplement stack keys.
  function activeDateKey() {
    var now = new Date();
    if (now.getHours() < 6) { var d = new Date(now); d.setDate(d.getDate() - 1); return ymd(d); }
    return ymd(now);
  }
  var activeKey = activeDateKey();

  // ------------------------------------------------------------
  // 1. HEADER — split comes from main.html's per-week planner
  //    (localStorage 'weekplan:<ISO-week>'), the only place in the
  //    dashboard that already unifies gym days + run days + rest.
  // ------------------------------------------------------------
  function mondayOf(date) {
    var d = new Date(date);
    var day = d.getDay();
    d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
    d.setHours(0, 0, 0, 0);
    return d;
  }
  function isoWeekKey(date) {
    var d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    var dayNum = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);
    var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    var weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    return d.getUTCFullYear() + '-W' + pad2(weekNo);
  }
  function getSplit() {
    var monday = mondayOf(today);
    var plan = storeGet('weekplan:' + isoWeekKey(monday)) || {};
    return plan[todayKey] || null; // 'push' | 'pull' | 'legs' | 'run' | 'rest' | null
  }

  var SPLIT_LABELS = { push: 'Push Day', pull: 'Pull Day', legs: 'Legs Day', run: 'Run Day', rest: 'Rest Day' };
  var SPLIT_COLORS = { push: '#6BE3A4', pull: '#6BE3A4', legs: '#6BE3A4', run: '#FF8F5E', rest: '#76746E' };
  function hexToRgba(hex, alpha) {
    var h = hex.replace('#', '');
    var r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  function renderHeader() {
    var dows = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    var mons = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    document.getElementById('todayDate').textContent =
      dows[today.getDay()] + ', ' + mons[today.getMonth()] + ' ' + today.getDate();

    var split = getSplit();
    var badge = document.getElementById('splitBadge');
    var color = SPLIT_COLORS[split] || '#76746E';
    badge.textContent = split ? (SPLIT_LABELS[split] || split) : 'Not Planned';
    badge.style.color = color;
    badge.style.background = hexToRgba(color, 0.12);

    renderTraining(split);
  }

  // ------------------------------------------------------------
  // 3. TODAY'S TRAINING
  // ------------------------------------------------------------
  function fmtKm(km) {
    if (km == null || !isFinite(km) || km <= 0) return '—';
    var r = Math.round(km * 10) / 10;
    return (r % 1 === 0 ? r.toFixed(0) : r.toFixed(1)) + ' km';
  }
  function fmtPace(secPerKm) {
    if (!secPerKm || !isFinite(secPerKm)) return '—';
    var m = Math.floor(secPerKm / 60), s = Math.round(secPerKm % 60);
    return m + ':' + (s < 10 ? '0' + s : s) + '/km';
  }

  function renderTraining(split) {
    var wrap = document.getElementById('trainingBody');
    var link = document.getElementById('trainingLink');

    if (!split) {
      wrap.innerHTML = '<div class="empty-state">No split planned for today.</div>';
      link.href = 'main.html'; link.textContent = 'Plan your week →';
      return;
    }
    if (split === 'rest') {
      wrap.innerHTML = '<div class="empty-state">Rest day — recovery in progress.</div>';
      link.href = 'gym.html'; link.textContent = 'Open Fitness →';
      return;
    }
    if (split === 'run') {
      var wp = storeGet('run:weekPlan');
      var dow = (today.getDay() + 6) % 7; // 0=Mon .. 6=Sun
      var entry = (Array.isArray(wp) && wp.length === 7) ? wp.find(function (e) { return e.dow === dow; }) : null;
      if (!entry || entry.rest) {
        wrap.innerHTML = '<div class="empty-state">No run scheduled today.</div>';
      } else {
        wrap.innerHTML =
          '<div class="stat-grid">' +
            '<div class="stat"><div class="stat-num">' + fmtKm(entry.distanceKm) + '</div><div class="stat-label">Distance</div></div>' +
            '<div class="stat"><div class="stat-num">' + fmtPace(entry.paceTargetSecPerKm) + '</div><div class="stat-label">Pace</div></div>' +
            '<div class="stat"><div class="stat-num" style="font-size:15px;">' + escapeHtml(entry.hrZone || '—') + '</div><div class="stat-label">HR Zone</div></div>' +
          '</div>' +
          '<div class="training-note">' + escapeHtml(entry.type || 'Run') + (entry.purpose ? ' · ' + escapeHtml(entry.purpose) : '') + '</div>';
      }
      link.href = 'running.html'; link.textContent = 'Log run →';
      return;
    }

    // Gym day (push / pull / legs)
    var gym = storeGet('po_coach_v1');
    var unit = (gym && gym.units) || 'kg';
    var logsMap = (gym && gym.logs) || {};
    var exercises = (gym && Array.isArray(gym.exercises)) ? gym.exercises.filter(function (e) { return e.day === split; }) : [];

    if (!exercises.length) {
      wrap.innerHTML = '<div class="empty-state">No exercises set for ' + escapeHtml(split) + ' day.</div>';
    } else {
      wrap.innerHTML = '<ul class="ro-list">' + exercises.map(function (ex) {
        var logs = logsMap[ex.id] || [];
        var last = logs.length ? logs[logs.length - 1] : null;
        var lastLabel;
        if (last) {
          lastLabel = ex.bw ? (last.reps + ' reps') : (last.weight + unit + ' × ' + last.reps);
        } else {
          lastLabel = ex.bw ? 'Not logged yet' : ((ex.startWeight || 0) + unit + ' (start)');
        }
        return '<li class="gm-row ex-row"><span class="ex-name">' + escapeHtml(ex.name) + '</span>' +
          '<span class="row-meta">' + escapeHtml(lastLabel) + '</span></li>';
      }).join('') + '</ul>';
    }
    link.href = 'gym.html'; link.textContent = 'Log workout →';
  }

  // ------------------------------------------------------------
  // 2. WATER — mirrors po-water.html's computeTargetMl() + unit math.
  // ------------------------------------------------------------
  function renderWater() {
    var w = storeGet('po_water_v1');
    var count = 0, target = 0, unitLabel = 'BOTTLES DRANK TODAY';

    if (w) {
      count = (w.logs && w.logs[todayKey]) || 0;
      var unit = w.unit || 'bottle';
      var bottleMl = w.bottleMl || 500, glassMl = w.glassMl || 250;
      var unitVol = unit === 'bottle' ? bottleMl : unit === 'glass' ? glassMl : unit === 'oz' ? 30 : 1;
      var unitPlural = unit === 'bottle' ? 'bottles' : unit === 'glass' ? 'glasses' : unit === 'oz' ? 'oz' : 'ml';
      unitLabel = unitPlural.toUpperCase() + ' DRANK TODAY';

      var totalMl;
      if (w.useManualTarget) {
        totalMl = w.manualTargetMl || 0;
      } else {
        var p = Object.assign({ weightKg: 75, age: 25, sex: 'm', activityHrsPerWeek: 5 }, w.profile || {});
        var wKg = w.weightUnit === 'lb' ? (p.weightKg / 2.20462) : p.weightKg;
        var base = wKg * 35;
        var exercise = (p.activityHrsPerWeek || 0) / 7 * 500;
        var caffeine = Math.max(0, (w.caffeineMgPerDay != null ? w.caffeineMgPerDay : 200) - 200) * 1.5;
        var subs = (w.substances || []).reduce(function (s, x) {
          var dose = x.dose != null ? x.dose : x.defaultDose;
          return s + Math.max(0, (dose || 0) * (x.mlPerUnit || 0));
        }, 0);
        var adjust = 0;
        if (p.sex === 'm') adjust += 200;
        if ((p.age || 0) >= 50) adjust += 100;
        totalMl = base + exercise + caffeine + subs + adjust;
      }
      target = Math.max(1, Math.ceil(totalMl / unitVol));
    }

    document.getElementById('waterNum').textContent = count;
    document.getElementById('waterTotal').textContent = '/ ' + target;
    document.getElementById('waterUnitLabel').textContent = unitLabel;
  }

  // ------------------------------------------------------------
  // 4. SUPPLEMENT STACK
  // ------------------------------------------------------------
  function renderStack() {
    var items = storeGet('stack:items') || [];
    var taken = storeGet('stack:taken:' + activeKey) || {};
    var total = items.length;
    var takenCount = items.filter(function (i) { return taken[i.id]; }).length;

    document.getElementById('stackCount').textContent = takenCount + ' / ' + total;
    var listEl = document.getElementById('stackList');
    if (!total) {
      listEl.innerHTML = '<div class="empty-state">No supplements set up yet.</div>';
      return;
    }
    listEl.innerHTML = items.map(function (i) {
      var isTaken = !!taken[i.id];
      return '<div class="gm-row' + (isTaken ? ' gm-row-done' : '') + '">' +
        '<span class="ro-check' + (isTaken ? ' is-on' : '') + '">' + (isTaken ? '✓' : '') + '</span>' +
        '<div class="gm-text">' + escapeHtml(i.name) + '</div></div>';
    }).join('');
  }

  // ------------------------------------------------------------
  // 5. TO-DO — top 3–5 items, undone first.
  // ------------------------------------------------------------
  function renderTodos() {
    var list = storeGet('goals:' + activeKey) || [];
    var undone = list.filter(function (g) { return !g.done; });
    var done = list.filter(function (g) { return g.done; });
    var ordered = undone.concat(done).slice(0, 5);

    document.getElementById('todoCount').textContent = done.length + ' / ' + list.length;
    var listEl = document.getElementById('todoList');
    if (!ordered.length) {
      listEl.innerHTML = '<div class="empty-state">Nothing on today’s list.</div>';
      return;
    }
    listEl.innerHTML = ordered.map(function (g) {
      return '<div class="gm-row' + (g.done ? ' gm-row-done' : '') + '">' +
        '<span class="ro-check' + (g.done ? ' is-on' : '') + '">' + (g.done ? '✓' : '') + '</span>' +
        '<div class="gm-text">' + escapeHtml(g.text) + '</div></div>';
    }).join('');
  }

  // ------------------------------------------------------------
  // 6. FINANCE — days until the nearest subscription renewal.
  // ------------------------------------------------------------
  function nextRenewalDate(isoDate, period) {
    var isoSafe = (typeof isoDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(isoDate)) ? isoDate + 'T00:00' : isoDate;
    var d = new Date(isoSafe);
    if (isNaN(d)) return null;
    var now = new Date();
    var todayLocal = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var safety = 0;
    while (d < todayLocal && safety++ < 600) {
      if (period === 'weekly') d.setDate(d.getDate() + 7);
      else if (period === 'yearly') d.setFullYear(d.getFullYear() + 1);
      else d.setMonth(d.getMonth() + 1);
    }
    return d;
  }
  function renderFinance() {
    var subs = storeGet('subs') || [];
    var todayLocal = new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime();
    var best = null;
    subs.forEach(function (s) {
      if (!s.renewal) return;
      var next = nextRenewalDate(s.renewal, s.period);
      if (!next) return;
      var days = Math.round((next.getTime() - todayLocal) / 86400000);
      if (!best || days < best.days) {
        best = {
          name: s.name, days: days,
          amount: s.entered_amount != null ? s.entered_amount : s.amount,
          currency: s.entered_currency || 'CHF'
        };
      }
    });
    var el = document.getElementById('financeLine');
    if (!best) { el.textContent = 'No subscriptions tracked.'; return; }
    var dayLabel = best.days <= 0 ? (best.days === 0 ? 'today' : 'overdue') : best.days === 1 ? 'in 1 day' : ('in ' + best.days + ' days');
    var amtLabel = best.amount != null ? (best.currency + ' ' + Number(best.amount).toLocaleString('en-US', { maximumFractionDigits: 2 })) : '';
    el.innerHTML = '<strong>' + escapeHtml(best.name) + '</strong> renews ' + dayLabel + (amtLabel ? ' · ' + escapeHtml(amtLabel) : '');
  }

  // ------------------------------------------------------------
  // 7. STREAKS — consecutive days ending today (or yesterday if
  //    today isn't logged yet), matching gym.html's wtRenderStreak
  //    pattern applied to each source's own log.
  // ------------------------------------------------------------
  function waterStreak() {
    var w = storeGet('po_water_v1');
    var logs = (w && w.logs) || {};
    var cursor = todayKey;
    if (!(logs[cursor] > 0)) cursor = addDaysKey(cursor, -1);
    var streak = 0;
    while (logs[cursor] > 0) { streak++; cursor = addDaysKey(cursor, -1); }
    return streak;
  }
  function suppStreak() {
    function hasTaken(key) {
      var t = storeGet('stack:taken:' + key);
      return !!(t && Object.keys(t).length > 0);
    }
    var cursor = activeKey;
    if (!hasTaken(cursor)) cursor = addDaysKey(cursor, -1);
    var streak = 0;
    while (hasTaken(cursor)) { streak++; cursor = addDaysKey(cursor, -1); }
    return streak;
  }
  function workoutStreak() {
    var done = storeGet('po_coach_workout_done') || {};
    var cursor = todayKey;
    if (!done[cursor]) cursor = addDaysKey(cursor, -1);
    var streak = 0;
    while (done[cursor]) { streak++; cursor = addDaysKey(cursor, -1); }
    return streak;
  }
  function renderStreaks() {
    document.getElementById('streakWater').textContent = waterStreak();
    document.getElementById('streakStack').textContent = suppStreak();
    document.getElementById('streakWorkout').textContent = workoutStreak();
  }

  // ------------------------------------------------------------
  renderHeader();
  renderWater();
  renderStack();
  renderTodos();
  renderFinance();
  renderStreaks();
})();
</script>
</body>
</html>
